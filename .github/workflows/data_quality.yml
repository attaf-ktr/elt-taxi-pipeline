name: Data Quality Validation (Great Expectations)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  gx-validation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install great_expectations==0.18.22 "snowflake-connector-python[pandas]" snowflake-sqlalchemy "sqlalchemy<2.0.0"

      - name: Run Great Expectations Checkpoint
        env:
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: |
          cd quality
          great_expectations checkpoint run stg_taxi_trips_checkpoint